version: "3.9"

services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/rapidroute
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production_use_long_random_string}
      JWT_EXPIRES_IN: 7d
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173}
      OSRM_BASE_URL: ${OSRM_BASE_URL:-https://router.project-osrm.org}
      ML_SERVICE_URL: http://ml:8000
      TRACKING_SIMULATION_ENABLED: "true"
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
    depends_on:
      - mongodb
      - ml

  ml:
    build:
      context: ./ml
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      PORT: 8000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

  # Optional self-hosted OSRM (requires preparing map data first — see docs/osrm.md)
  # osrm:
  #   image: osrm/osrm-backend
  #   ports:
  #     - "5000:5000"
  #   volumes:
  #     - ./docker/osrm-data:/data
  #   command: osrm-routed --algorithm mld /data/india-latest.osrm

volumes:
  mongodb_data:
